name: Just Eat bike watcher

on:
  schedule:
    # Nominally every 30 minutes. GitHub does NOT honour that — measured
    # delivery has been 6-8 runs a day, 1-5 hours apart. Each run therefore
    # holds the runner and polls for ~50 minutes (see --poll below) instead of
    # taking one instant sample, and the concurrency queue starts the next run
    # as soon as this one ends. That is affordable only because this repo is
    # public: Actions minutes are unmetered on public repos.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: justeat-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check for e-bike openings
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # 11 checks, 5 minutes apart. A slot that opens and closes inside an
        # hour — which is what the 18 Aug window looked like — now gets seen.
        run: python watch.py --once --poll 50 --poll-interval 5

      - name: Remember what we saw
        run: |
          git config user.name  "justeat-watcher"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "state: $(date -u +%FT%TZ)"
          # Another run may have pushed while we were polling. Rebase onto it
          # rather than failing the job and losing this run's observation.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          echo "could not push state after 3 attempts" >&2
          exit 1
