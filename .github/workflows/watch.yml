name: Just Eat bike watcher

on:
  schedule:
    # Nominally every 30 minutes. GitHub does NOT honour this on a private repo:
    # measured delivery is 6-8 runs a day, 1-5 hours apart. See the README for
    # why we don't paper over that with --poll here: a private repo gets 2000
    # free Actions minutes a month and every started minute is billed, so a
    # poll long enough to matter against a 3-hour gap would exhaust the quota
    # and stop the watcher entirely. Cheap and alive beats frequent and dead.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: justeat-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check for e-bike openings
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # If this repo is ever made public, Actions minutes stop being metered
        # and `--poll 25 --poll-interval 5` here becomes the right call.
        run: python watch.py --once

      - name: Remember what we saw
        run: |
          git config user.name  "justeat-watcher"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "state: $(date -u +%FT%TZ)"
          # Another run may have pushed while we were polling. Rebase onto it
          # rather than failing the job and losing this run's observation.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          echo "could not push state after 3 attempts" >&2
          exit 1
